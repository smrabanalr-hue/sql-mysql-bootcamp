services:
  mysql-bootcamp:
    image: mysql:8.0.36
    container_name: mysql-bootcamp
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tienda_retail
    ports:
      - "3306:3306"
    volumes:
      - mysql_bootcamp_data:/var/lib/mysql
      - ./datasets:/datasets:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_bootcamp_data:
    driver: local
